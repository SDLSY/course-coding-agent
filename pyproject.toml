[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "course-coding-agent"
version = "0.1.0"
description = "A small, framework-free coding agent runtime for a software engineering project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "ruff>=0.16,<0.17",
]
harbor = [
  "harbor==0.22.0",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"
coding-agent-benchmark = "coding_agent.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
